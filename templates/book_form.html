{% extends 'base.html' %}
{% block content %}
<h1>{{ 'Edit' if book else 'Add' }} Book</h1>
<form method="post" class="card card-body">
  <label class="form-label">Title</label><input class="form-control mb-3" name="title" value="{{ book.title if book else '' }}" required>
  <label class="form-label">Author</label><input class="form-control mb-3" name="author" value="{{ book.author if book else '' }}" required>
  <label class="form-label">Genre</label><input class="form-control mb-3" name="genre" value="{{ book.genre if book else '' }}" required>
  <label class="form-label">Published Date</label><input class="form-control mb-3" name="published_date" type="date" value="{{ book.published_date if book and book.published_date else '' }}">
  <label class="form-label">ISBN</label><input class="form-control mb-3" name="isbn" value="{{ book.isbn if book else '' }}" required>
  <button class="btn btn-primary">Save</button>
</form>
{% endblock %}
