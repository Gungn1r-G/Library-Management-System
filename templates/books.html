{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3"><h1>Books</h1><a class="btn btn-primary" href="{{ url_for('new_book') }}">Add Book</a></div>
<table class="table table-striped"><thead><tr><th>Title</th><th>Author</th><th>Genre</th><th>ISBN</th><th>Availability</th><th>Actions</th></tr></thead><tbody>
{% for b in books %}<tr><td><a href="{{ url_for('book_detail', book_id=b.book_id) }}">{{ b.title }}</a></td><td>{{ b.author }}</td><td>{{ b.genre }}</td><td>{{ b.isbn }}</td><td>{{ 'Available' if b.is_available else 'Borrowed' }}</td><td><a class="btn btn-sm btn-outline-secondary" href="{{ url_for('edit_book', book_id=b.book_id) }}">Edit</a> <form class="d-inline" method="post" action="{{ url_for('delete_book', book_id=b.book_id) }}"><button class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete book?')">Delete</button></form></td></tr>{% endfor %}
</tbody></table>
{% endblock %}
