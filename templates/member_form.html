{% extends 'base.html' %}
{% block content %}
<h1>{{ 'Edit' if member else 'Add' }} Member</h1>
<form method="post" class="card card-body">
  <label class="form-label">Full Name</label><input class="form-control mb-3" name="full_name" value="{{ member.full_name if member else '' }}" required>
  <label class="form-label">Email</label><input class="form-control mb-3" name="email" type="email" value="{{ member.email if member else '' }}" required>
  <label class="form-label">Phone</label><input class="form-control mb-3" name="phone" value="{{ member.phone if member else '' }}">
  <label class="form-label">Join Date</label><input class="form-control mb-3" name="join_date" type="date" value="{{ member.join_date if member else '' }}" required>
  <button class="btn btn-primary">Save</button>
</form>
{% endblock %}
